pool:
  vmImage: ubuntu-latest

name: Deploy Bicep files

variables:
  serviceConnectionName: 'eng-lab-automation'
  location: 'uksouth'
  templateFile: '$(Build.Repository.LocalPath)/Bicep/main.bicep'
  parameterFile: '$(Build.Repository.LocalPath)/Bicep/env/dev.bicepparam'
  DeploymentName: main
  subscriptionId: 800eeb5c-ab87-468f-800b-d9ca632b4f73

stages:  
  - stage: Lint
    jobs:
      - job: LintCode
        displayName: Lint code
        steps:              
          - task: replacetokens@5
            name: Update_File
            displayName: Update File
            inputs:
              targetFiles: '$(Build.Repository.LocalPath)/Bicep/checkov-linux.gdnconfig'
              encoding: auto
              tokenPattern: default
              writeBOM: true
              escapeType: none
              verbosity: detailed
              actionOnMissing: warn
              keepToken: false
              actionOnNoFiles: warn
              enableTransforms: false
              enableRecursion: false
              useLegacyPattern: false
              enableTelemetry: false

          - task: Bash@3
            name: check_config_file
            displayName: check_config_file
            inputs:
              targetType: 'inline'
              script: |
                cat '$(Build.Repository.LocalPath)/Bicep/checkov-linux.gdnconfig'   

          - task: MicrosoftSecurityDevOps@1
            displayName: 'Microsoft Security DevOps'
            inputs:
              categories: 'IaC'
              config: '$(Build.Repository.LocalPath)/Bicep/checkov-linux.gdnconfig'
              publish: true
              artifactName: 'CodeAnalysisLogs'