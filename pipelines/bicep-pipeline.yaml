pool:
  name: linux-agent-pool

name: Deploy Bicep files

variables:
  serviceConnectionName: 'eng-lab-automation'
  location: 'uksouth'
  templateFile: '$(Build.Repository.LocalPath)/Bicep/main.bicep'
  parameterFile: '$(Build.Repository.LocalPath)/Bicep/env/dev.bicepparam'
  DeploymentName: main
  subscriptionId: 800eeb5c-ab87-468f-800b-d9ca632b4f73

stages:  
  - stage: Lint
    jobs:
      - job: LintCode
        displayName: Lint code
        steps:
          # Validate Bicep parameter file is valid bicepparam
          - task: CmdLine@2
            name: Validate_Bicep_Parameters_File
            displayName: Validate Bicep Parameters File
            inputs:
              script: az bicep build-params --file $(parameterFile) --stdout

          # Lint Bicep Template
          - task: Bash@3
            name: Lint_Bicep_Template
            displayName: Lint Bicep Template
            inputs:
              targetType: 'inline'
              script: |
                bicep lint $(templateFile) --diagnostics-format sarif > $(System.DefaultWorkingDirectory)/bicep.sarif
                
          # Publish Test
          - task: PublishBuildArtifacts@1
            condition: always()
            displayName: Publish Linting Results
            inputs:
              pathToPublish: $(System.DefaultWorkingDirectory)/bicep.sarif
              artifactName: CodeAnalysisLogs # required to show up in the scans tab

          - task: MicrosoftSecurityDevOps@1
            inputs:
              command: 'run'
              categories: 'IaC'
              break: false
              languages: 'Bicep'
              tools: 'checkov'
              publish: true
              artifactName: 'BicepCodeAnalysisLogs' 

  - stage: ValidatePreviewDeployment
    dependsOn: Lint
    jobs:
      - job: ValidatePreviewDeployment
        displayName: Validate & Preview Deployment
        steps:
          # Validate Bicep Deployment
          - task: AzureCLI@2
            name: Bicep_Deployment_Validation
            displayName: Bicep Deployment Validation
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az deployment sub validate --location uksouth \
                --template-file $(templateFile) \
                --parameters $(parameterFile)
              workingDirectory: $(Pipeline.Workspace)

          # Preview Bicep Deployment
          - task: ARMDeploymentInsights@2
            name: Preview_Bicep_Template
            displayName: Preview Bicep Deployment
            inputs:
              deploymentName: $(DeploymentName)
              deploymentScope: 'Subscription'
              armServiceConnection: $(serviceConnectionName)
              subscriptionId: $(subscriptionId)
              location: 'UK South'
              templateLocation: 'File'
              templateFile: '$(templateFile)'
              templateParametersFile: '$(parameterFile)'

  - stage: Deploy
    dependsOn: ValidatePreviewDeployment
    jobs:
      - deployment: Deploy
        environment: DEV
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                # Deploy Bicep Deployment
                - task: AzureCLI@2
                  name: Infrastructure_Deployment
                  displayName: Infrastructure Deployment
                  inputs:
                    azureSubscription: $(serviceConnectionName)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az deployment sub create --location uksouth \
                      --template-file $(templateFile) \
                      --parameters $(parameterFile)
                    workingDirectory: $(Pipeline.Workspace)
