trigger:
- main

variables:
  - group: DEV  # Make sure this variable group exists and contains 'agent_pool' and 'env'
  - name: environment
    value: ${{ variables.env }}  # Compile-time evaluation

stages:
  - stage: DEV
    displayName: 'Development Stage'
    pool:
      name: ${{ variables.agent_pool }}  # Compile-time pool reference
    jobs:
      - job: TestJob
        steps:
          - script: |
              echo "Running on the agent pool: ${{ variables.agent_pool }}"
              echo "The environment is: ${{ variables.environment }}"
            displayName: "Run test commands"
