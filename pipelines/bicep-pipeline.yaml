  - stage: CodeComplianceCheck
    jobs:
      - job: RunComplianceChecks
        displayName: Run Code Compliance Checks
        steps:
          - task: CmdLine@2
            name: ValidateParametersFile
            displayName: Validate Parameters File
            inputs:
              script: bicep build-params --file $(parameterFile) --stdout

          - task: Bash@3
            name: CheckBicepFormat
            displayName: "Check Bicep Template Format"
            inputs:
              targetType: 'inline'
              script: |
                bicep format $(templateFile) --check

          - task: Bash@3
            name: RunBicepLint
            displayName: Run Bicep Linter
            inputs:
              targetType: 'inline'
              script: |
                bicep lint $(templateFile) --diagnostics-format sarif > $(System.DefaultWorkingDirectory)/bicep-linter-report.sarif

          - task: Bash@3
            name: RunCheckovComplianceScan
            displayName: Run Checkov Compliance Scan
            inputs:
              targetType: 'inline'
              script: |
                checkov --file $(templateFile) --framework bicep \
                --soft-fail --quiet --compact --output sarif \
                --output-file-path $(System.DefaultWorkingDirectory)/bicep-checkov-report.sarif

          - task: PublishBuildArtifacts@1
            name: PublishCodeAnalysisReports
            displayName: Publish Code Analysis Reports
            inputs:
              pathToPublish: $(System.DefaultWorkingDirectory)
              artifactName: CodeAnalysisLogs
